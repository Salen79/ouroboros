<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Архитектура THAI</title>
<link rel="stylesheet" href="styles.css?v=phase1.10">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="title">Архитектура THAI</div>
      <div class="subtitle" id="meta-sub">Загрузка…</div>
    </div>
    <nav class="views">
      <button class="view-btn active" data-view="overview">Обзор</button>
      <button class="view-btn" data-view="darkzones">Тёмные зоны <span class="pill" id="dz-count">0</span></button>
      <button class="view-btn" data-view="memory">Память</button>
      <button class="view-btn" data-view="tools">Инструменты <span class="pill" id="tool-count">0</span></button>
    </nav>
    <div class="right">
      <input type="search" id="search" placeholder="Поиск: файл, инструмент, D-ID…" autocomplete="off">
      <select id="filter">
        <option value="all">Фильтр: все</option>
        <option value="write">Запись</option>
        <option value="memory">Только память</option>
        <option value="dark">Слабости</option>
        <option value="tools">Инструменты</option>
      </select>
    </div>
  </header>

  <main id="main">
    <section id="view-overview" class="view active">
      <div id="cy" class="overview-host"></div>
    </section>

    <section id="view-darkzones" class="view">
      <div class="dz-layout">
        <div id="dz-list" class="dz-list"></div>
        <div id="dz-detail" class="dz-detail">
          <div class="muted">Выберите слабость, чтобы увидеть детали.</div>
        </div>
      </div>
    </section>

    <section id="view-memory" class="view">
      <div id="cy-memory" class="mem-host"></div>
    </section>

    <section id="view-tools" class="view">
      <div class="tool-layout">
        <div class="tool-filterbar">
          <button class="tool-chip active" data-tool-filter="all">Все</button>
          <button class="tool-chip" data-tool-filter="core">Core</button>
          <button class="tool-chip" data-tool-filter="write">Write</button>
          <button class="tool-chip" data-tool-filter="destructive">Опасные</button>
          <button class="tool-chip" data-tool-filter="consciousness">Whitelist сознания</button>
        </div>
        <div id="tool-grid" class="tool-grid"></div>
      </div>
    </section>

    <aside id="panel" class="panel">
      <button id="panel-close" class="panel-close" title="Закрыть">×</button>
      <div id="panel-body"></div>
    </aside>
  </main>

  <script type="module" src="main.js?v=phase1.10"></script>
</body>
</html>
