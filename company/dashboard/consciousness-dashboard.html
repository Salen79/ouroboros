<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THAI Consciousness Growth Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #e1e4ed;
    --muted: #8b8fa3;
    --accent: #6c5ce7;
    --green: #00b894;
    --yellow: #fdcb6e;
    --red: #e17055;
    --blue: #74b9ff;
    --purple: #a29bfe;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    min-height: 100vh;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 22px; font-weight: 600; }
  .header .date { color: var(--muted); font-size: 14px; }
  .summary-bar {
    display: flex;
    gap: 24px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .summary-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 24px;
    flex: 1;
    min-width: 200px;
  }
  .summary-item .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .summary-item .value { font-size: 28px; font-weight: 700; }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    margin-top: 8px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .card-title { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .card-score { font-size: 24px; font-weight: 700; }
  .metric-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 13px;
    border-bottom: 1px solid rgba(42, 45, 58, 0.5);
  }
  .metric-row:last-child { border-bottom: none; }
  .metric-label { color: var(--muted); }
  .metric-value { font-weight: 500; font-variant-numeric: tabular-nums; }
  .chart-container { margin-bottom: 24px; }
  .chart-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .chart-card h3 { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
  .events-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .events-card h3 { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .event-item {
    padding: 8px 0;
    border-bottom: 1px solid rgba(42, 45, 58, 0.5);
    font-size: 13px;
  }
  .event-item:last-child { border-bottom: none; }
  .event-date { color: var(--accent); font-weight: 600; margin-right: 8px; }
  .score-color-high { color: var(--green); }
  .score-color-mid { color: var(--yellow); }
  .score-color-low { color: var(--red); }
  .loading {
    text-align: center;
    padding: 100px 0;
    color: var(--muted);
    font-size: 16px;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-green { background: rgba(0,184,148,0.15); color: var(--green); }
  .badge-red { background: rgba(225,112,85,0.15); color: var(--red); }
</style>
</head>
<body>

<div id="app">
  <div class="loading" id="loading">Loading consciousness data...</div>
</div>

<script>
const API_URL = '/api/consciousness/consciousness_history.json';

function scoreColor(score) {
  if (score >= 7) return 'score-color-high';
  if (score >= 4) return 'score-color-mid';
  return 'score-color-low';
}

function scoreColorHex(score) {
  if (score >= 7) return '#00b894';
  if (score >= 4) return '#fdcb6e';
  return '#e17055';
}

function fmt(v, decimals = 1) {
  if (v === null || v === undefined) return '—';
  return typeof v === 'number' ? v.toFixed(decimals) : v;
}

function pct(v) {
  if (v === null || v === undefined) return '—';
  return (v * 100).toFixed(0) + '%';
}

function renderDashboard(data) {
  const snapshots = data.snapshots || [];
  if (!snapshots.length) {
    document.getElementById('app').innerHTML = '<div class="loading">No data available yet.</div>';
    return;
  }

  const latest = snapshots[snapshots.length - 1];
  const prev = snapshots.length > 1 ? snapshots[snapshots.length - 2] : null;
  const s = latest.summary;
  const mc = latest.meta_cognition;
  const eff = latest.efficiency;
  const mem = latest.memory;
  const beh = latest.behavior;
  const ic = latest.inner_critic || {};

  const budgetPct = s.budget_total > 0 ? ((s.budget_remaining / s.budget_total) * 100).toFixed(0) : 0;
  const budgetColor = budgetPct > 30 ? '#00b894' : budgetPct > 15 ? '#fdcb6e' : '#e17055';

  // Delta helper
  function delta(curr, prevSnap, path) {
    if (!prevSnap) return '';
    const keys = path.split('.');
    let pv = prevSnap;
    for (const k of keys) { pv = pv?.[k]; }
    if (pv === undefined || pv === null) return '';
    const d = curr - pv;
    if (d === 0) return '';
    const sign = d > 0 ? '+' : '';
    return ` <span style="color:${d > 0 ? '#00b894' : '#e17055'};font-size:11px">${sign}${typeof curr === 'number' && !Number.isInteger(curr) ? d.toFixed(1) : d}</span>`;
  }

  document.getElementById('app').innerHTML = `
    <div class="header">
      <h1>THAI Consciousness Growth Dashboard</h1>
      <div class="date">${latest.date}</div>
    </div>

    <div class="summary-bar">
      <div class="summary-item">
        <div class="label">Overall Score</div>
        <div class="value ${scoreColor(s.overall_consciousness_score)}">${fmt(s.overall_consciousness_score)}/10</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${s.overall_consciousness_score*10}%;background:${scoreColorHex(s.overall_consciousness_score)}"></div></div>
      </div>
      <div class="summary-item">
        <div class="label">Budget</div>
        <div class="value">$${fmt(s.budget_remaining, 0)}<span style="color:var(--muted);font-size:16px">/$${s.budget_total}</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${budgetPct}%;background:${budgetColor}"></div></div>
      </div>
      <div class="summary-item">
        <div class="label">Tasks Today</div>
        <div class="value">${s.tasks_today}${delta(s.tasks_today, prev, 'summary.tasks_today')}</div>
      </div>
      <div class="summary-item">
        <div class="label">All-Time Tasks</div>
        <div class="value">${s.total_tasks_all_time}</div>
      </div>
    </div>

    <div class="grid">
      <!-- Meta-Cognition -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Meta-Cognition</span>
          <span class="card-score ${scoreColor(mc.score)}">${fmt(mc.score)}/10</span>
        </div>
        <div class="metric-row"><span class="metric-label">Experiments started</span><span class="metric-value">${mc.experiments_started}</span></div>
        <div class="metric-row"><span class="metric-label">Experiments confirmed</span><span class="metric-value">${mc.experiments_confirmed}</span></div>
        <div class="metric-row"><span class="metric-label">Self-evolution events</span><span class="metric-value">${mc.self_evolution_events}</span></div>
        <div class="metric-row"><span class="metric-label">Reflections</span><span class="metric-value">${mc.reflections_with_action}</span></div>
        <div class="metric-row"><span class="metric-label">Skills created</span><span class="metric-value">${mc.skills_created_today}</span></div>
        <div class="metric-row"><span class="metric-label">Patterns detected</span><span class="metric-value">${mc.patterns_detected}</span></div>
        <div class="metric-row"><span class="metric-label">Reuse rate</span><span class="metric-value">${pct(mc.reuse_rate)}</span></div>
      </div>

      <!-- Efficiency -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Efficiency</span>
          <span class="card-score ${scoreColor(s.efficiency_score)}">${fmt(s.efficiency_score)}/10</span>
        </div>
        <div class="metric-row"><span class="metric-label">Tasks completed</span><span class="metric-value">${eff.tasks_completed}${delta(eff.tasks_completed, prev, 'efficiency.tasks_completed')}</span></div>
        <div class="metric-row"><span class="metric-label">Avg rounds</span><span class="metric-value">${fmt(eff.avg_rounds)}${delta(eff.avg_rounds, prev, 'efficiency.avg_rounds')}</span></div>
        <div class="metric-row"><span class="metric-label">Avg cost</span><span class="metric-value">$${fmt(eff.avg_cost, 3)}</span></div>
        <div class="metric-row"><span class="metric-label">Total daily cost</span><span class="metric-value">$${fmt(eff.total_daily_cost, 2)}</span></div>
        <div class="metric-row"><span class="metric-label">Consciousness cost</span><span class="metric-value">$${fmt(eff.consciousness_cost, 3)}</span></div>
        <div class="metric-row"><span class="metric-label">Success rate</span><span class="metric-value">${pct(eff.task_success_rate)}</span></div>
      </div>

      <!-- Memory -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Memory</span>
          <span class="card-score ${scoreColor(s.memory_score)}">${fmt(s.memory_score)}/10</span>
        </div>
        <div class="metric-row"><span class="metric-label">Total skills</span><span class="metric-value">${mem.total_skills}${delta(mem.total_skills, prev, 'memory.total_skills')}</span></div>
        <div class="metric-row"><span class="metric-label">Skills created today</span><span class="metric-value">${mem.skills_created_today}</span></div>
        <div class="metric-row"><span class="metric-label">Skills used today</span><span class="metric-value">${mem.skills_used_today}</span></div>
        <div class="metric-row"><span class="metric-label">Reuse rate</span><span class="metric-value">${pct(mem.skill_reuse_rate)}</span></div>
        <div class="metric-row"><span class="metric-label">Total episodes</span><span class="metric-value">${mem.total_episodes}${delta(mem.total_episodes, prev, 'memory.total_episodes')}</span></div>
        <div class="metric-row"><span class="metric-label">Knowledge files</span><span class="metric-value">${mem.total_knowledge_files}</span></div>
        <div class="metric-row"><span class="metric-label">History chunks</span><span class="metric-value">${mem.history_chunks}${delta(mem.history_chunks, prev, 'memory.history_chunks')}</span></div>
      </div>

      <!-- Behavior -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Behavior</span>
          <span class="card-score ${scoreColor(beh.score)}">${fmt(beh.score)}/10</span>
        </div>
        <div class="metric-row"><span class="metric-label">Stuck loops</span><span class="metric-value">${beh.stuck_events}</span></div>
        <div class="metric-row"><span class="metric-label">Circuit breakers</span><span class="metric-value">${beh.circuit_breaker_triggers}</span></div>
        <div class="metric-row"><span class="metric-label">Commitments met</span><span class="metric-value">${beh.commitments_met}</span></div>
        <div class="metric-row"><span class="metric-label">Commitments overdue</span><span class="metric-value">${beh.commitments_overdue}</span></div>
        <div class="metric-row"><span class="metric-label">Directives</span><span class="metric-value">${beh.directive_compliance ? '<span class="badge badge-green">Compliant</span>' : '<span class="badge badge-red">Violation</span>'}</span></div>
        <div class="metric-row"><span class="metric-label">Dedup blocked</span><span class="metric-value">${beh.message_dedup_blocked}</span></div>
        <div class="metric-row"><span class="metric-label">Proactive skipped</span><span class="metric-value">${beh.proactive_skipped}</span></div>
        <div class="metric-row"><span class="metric-label">Avg pause</span><span class="metric-value">${fmt(beh.avg_pause_before_action_sec)}s</span></div>
      </div>

      <!-- Inner Critic -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Inner Critic</span>
          <span class="card-score" style="color:var(--red)">${ic.checkpoints_today || 0}</span>
        </div>
        <div class="metric-row"><span class="metric-label">Checkpoints today</span><span class="metric-value">${ic.checkpoints_today || 0}</span></div>
        <div class="metric-row"><span class="metric-label">Off-track alerts</span><span class="metric-value">${ic.off_track_alerts || 0}</span></div>
        <div class="metric-row"><span class="metric-label">Course corrections</span><span class="metric-value">${ic.course_corrections || 0}</span></div>
        <div class="metric-row"><span class="metric-label">Correction rate</span><span class="metric-value">${pct(ic.correction_success_rate || 0)}</span></div>
        <div class="metric-row"><span class="metric-label">Critic cost</span><span class="metric-value">$${fmt(ic.total_critic_cost || 0, 3)}</span></div>
        <div class="metric-row"><span class="metric-label">Skills from corrections</span><span class="metric-value">${ic.skills_created_from_corrections || 0}</span></div>
        <div class="metric-row"><span class="metric-label">Patterns matched</span><span class="metric-value">${(ic.patterns_matched || []).length}</span></div>
        <div class="metric-row"><span class="metric-label">Skipped (high conf)</span><span class="metric-value">${ic.skipped_high_confidence || 0}</span></div>
      </div>
    </div>

    <!-- 30-Day Timeline -->
    <div class="chart-container">
      <div class="chart-card">
        <h3>30-Day Timeline</h3>
        <canvas id="timelineChart" height="100"></canvas>
      </div>
    </div>

    <!-- Key Events -->
    <div class="events-card" id="eventsCard"></div>
  `;

  // Build timeline chart
  const labels = snapshots.map(s => s.date.slice(5));
  const ctx = document.getElementById('timelineChart').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Overall',
          data: snapshots.map(s => s.summary.overall_consciousness_score),
          borderColor: '#a29bfe',
          backgroundColor: 'rgba(162,155,254,0.1)',
          borderWidth: 2.5,
          fill: true,
          tension: 0.3,
          pointRadius: 2,
        },
        {
          label: 'Meta-Cognition',
          data: snapshots.map(s => s.meta_cognition.score),
          borderColor: '#6c5ce7',
          borderWidth: 1.5,
          tension: 0.3,
          pointRadius: 1,
        },
        {
          label: 'Efficiency',
          data: snapshots.map(s => s.summary.efficiency_score),
          borderColor: '#74b9ff',
          borderWidth: 1.5,
          tension: 0.3,
          pointRadius: 1,
        },
        {
          label: 'Memory',
          data: snapshots.map(s => s.summary.memory_score),
          borderColor: '#00b894',
          borderWidth: 1.5,
          tension: 0.3,
          pointRadius: 1,
        },
        {
          label: 'Behavior',
          data: snapshots.map(s => s.behavior.score),
          borderColor: '#fdcb6e',
          borderWidth: 1.5,
          tension: 0.3,
          pointRadius: 1,
        },
        {
          label: 'Critic Alerts',
          data: snapshots.map(s => (s.inner_critic || {}).off_track_alerts || 0),
          borderColor: '#e17055',
          borderWidth: 1,
          borderDash: [4, 4],
          tension: 0.3,
          pointRadius: 1,
        },
      ],
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          position: 'bottom',
          labels: { color: '#8b8fa3', boxWidth: 12, padding: 16, font: { size: 11 } },
        },
      },
      scales: {
        x: {
          ticks: { color: '#8b8fa3', font: { size: 10 } },
          grid: { color: 'rgba(42,45,58,0.5)' },
        },
        y: {
          min: 0, max: 10,
          ticks: { color: '#8b8fa3', stepSize: 2 },
          grid: { color: 'rgba(42,45,58,0.5)' },
        },
      },
      interaction: { intersect: false, mode: 'index' },
    },
  });

  // Key events
  const eventsHtml = [];
  for (let i = snapshots.length - 1; i >= Math.max(0, snapshots.length - 10); i--) {
    const snap = snapshots[i];
    const events = snap.key_events || [];
    if (events.length) {
      for (const ev of events.slice(0, 3)) {
        eventsHtml.push(`<div class="event-item"><span class="event-date">${snap.date.slice(5)}</span>${ev}</div>`);
      }
    }
  }
  const eventsCard = document.getElementById('eventsCard');
  eventsCard.innerHTML = `<h3>Key Events</h3>${eventsHtml.length ? eventsHtml.join('') : '<div class="event-item" style="color:var(--muted)">No key events detected yet.</div>'}`;
}

// Fetch and render
fetch(API_URL)
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(renderDashboard)
  .catch(err => {
    document.getElementById('app').innerHTML = `<div class="loading" style="color:#e17055">Error loading data: ${err.message}<br><small>Ensure /api/consciousness/consciousness_history.json is accessible</small></div>`;
  });
</script>
</body>
</html>
